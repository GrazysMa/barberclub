<style>
/* Layout: signage-style header with barber-pole band, two modes (client booking / barber dashboard), stepped flow + sticky summary */
:root{
  --bg:#eef1ef; --surface:#ffffff; --surface-2:#f6f8f7; --ink:#15201b; --muted:#5b6862; --line:#d3dad6;
  --red:#b3261e; --red-soft:#f8e3e1; --navy:#1f3a8a; --navy-soft:#e3e8f6; --ok:#1d7a4a; --ok-soft:#dff1e7; --warn:#9a5b00; --warn-soft:#fbefd9;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#171e1b; --surface-2:#1d2622; --ink:#e7ece9; --muted:#97a49e; --line:#2b3632;
  --red:#ec5b50; --red-soft:#3a1a18; --navy:#8ea6f2; --navy-soft:#1c2440; --ok:#5cc98d; --ok-soft:#14301f; --warn:#e9a94a; --warn-soft:#33260f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#171e1b; --surface-2:#1d2622; --ink:#e7ece9; --muted:#97a49e; --line:#2b3632;
  --red:#ec5b50; --red-soft:#3a1a18; --navy:#8ea6f2; --navy-soft:#1c2440; --ok:#5cc98d; --ok-soft:#14301f; --warn:#e9a94a; --warn-soft:#33260f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding:0 16px 48px}
.wrap{max-width:1080px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.pole{height:8px;margin:0 -16px;background:repeating-linear-gradient(-45deg,var(--red) 0 12px,var(--surface) 12px 20px,var(--navy) 20px 32px,var(--surface) 32px 40px)}
@media (prefers-reduced-motion:no-preference){.pole{background-size:56.57px 8px;animation:spin 3s linear infinite}}
@keyframes spin{to{background-position:56.57px 0}}

header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-block:22px 18px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6vw,52px);line-height:.95;letter-spacing:.01em;text-transform:uppercase;margin:0}
.brand-row{display:flex;align-items:center;gap:14px}
.logo{width:clamp(56px,10vw,76px);height:auto;flex:none;border-radius:50%}
.contact a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.contact a:hover{border-color:var(--ink)}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
.proto{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:99px;margin-bottom:8px}
.modes{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px}
.modes button{border:0;background:none;padding:8px 16px;border-radius:99px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.steps span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.steps span.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps span.done{color:var(--ink)}
h2{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 14px;line-height:1}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:700}

.list{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.opt .main{flex:1;min-width:0}
.opt .t{font-weight:600}
.opt .s{font-size:13px;color:var(--muted)}
.opt .p{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;background:var(--navy-soft);color:var(--navy);flex:none}
.avatar.any{background:var(--red-soft);color:var(--red)}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.day{flex:none;width:58px;padding:8px 0;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.day b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.05}
.day small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.day:disabled{opacity:.4;cursor:default}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.slot{font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding:9px 0;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.slot:hover{border-color:var(--ink)}
.slot[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}
.part{font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}

.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.field .err{font-size:12px;color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:8px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sum-row span:first-child{color:var(--muted)}
.sum-row span:last-child{text-align:right;font-weight:600}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px}
.sum-total b{font-family:var(--f-display);font-size:32px}
.info{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.45}
.info strong{color:var(--ink)}

.done-box{text-align:center;padding:16px 0}
.code{font-family:var(--f-mono);font-size:22px;letter-spacing:.1em;background:var(--surface-2);border:1px dashed var(--line);display:inline-block;padding:8px 16px;border-radius:8px;margin:8px 0 14px}

/* Dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat b{font-family:var(--f-display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .note{font-size:12px;color:var(--muted)}
.sched-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sched{display:grid;min-width:560px;position:relative}
.sched .head{position:sticky;top:0;background:var(--surface-2);border-bottom:1px solid var(--line);padding:10px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;z-index:2}
.sched .head .avatar{width:28px;height:28px;font-size:14px}
.col{position:relative;border-left:1px solid var(--line)}
.hours{position:relative}
.hours div{position:absolute;right:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);transform:translateY(-50%)}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.6}
.appt{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 8px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;text-align:left;border:1px solid transparent;background:var(--navy-soft);color:var(--ink);border-left:3px solid var(--navy)}
.appt b{display:block;font-weight:700}
.appt.new{background:var(--red-soft);border-left-color:var(--red)}
.appt.block{background:repeating-linear-gradient(-45deg,var(--surface-2) 0 6px,var(--line) 6px 8px);border-left-color:var(--muted);color:var(--muted)}
.appt.noshow{opacity:.55;text-decoration:line-through}
.appt[aria-pressed="true"]{outline:2px solid var(--ink)}
.now{position:absolute;left:0;right:0;border-top:2px solid var(--red);z-index:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.dash-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.dash-grid{grid-template-columns:minmax(0,1fr)}}
.side{display:grid;gap:16px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.new{background:var(--red-soft);color:var(--red)}
.pill.ns{background:var(--warn-soft);color:var(--warn)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cmp div{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.cmp small{font-size:12px;color:var(--muted)}
.cmp b{display:block;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.cmp .bad b{color:var(--red)} .cmp .good b{color:var(--ok)}
.save{margin-top:10px;font-weight:700;color:var(--ok)}
.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.share{display:flex;gap:8px}
.share input{flex:1;min-width:0;font-family:var(--f-mono);font-size:12px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:10}
footer{margin-top:28px;font-size:12px;color:var(--muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:8px 11px;font-family:var(--f-mono);font-size:12px;font-weight:500;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--red);color:#fff}
.qr{display:flex;gap:14px;align-items:center;margin-top:14px;flex-wrap:wrap}
.qr-box{background:#fff;padding:8px;border-radius:8px;width:132px;height:132px;flex:none;border:1px solid var(--line)}
.qr-box svg{width:100%;height:100%;display:block}
.qr p{flex:1;min-width:140px;margin:0}
</style>

</head>

let LANG='lt';try{const s=localStorage.getItem('bc-lang');if(s==='en'||s==='lt')LANG=s}catch(e){}
const T=()=>I18N[LANG];

const SERVICES=[
  {id:'cut',min:60,price:25},{id:'beard',min:35,price:20},{id:'brow',min:45,price:25},{id:'combo',min:75,price:35},{id:'kid',min:30,price:20},{id:'ritual',min:60,price:35},{id:'premium',min:90,price:45},{id:'perm',min:120,price:120},
];
const BARBERS=[{id:'mehmet',name:'Mehmet',role:'master'},{id:'metin',name:'Metin',role:'barber'},{id:'cagri',name:'Cagri',role:'barber'}];
const OPEN=600, CLOSE=1260, STEP=15;
const BOOK_URL=location.href.split('#')[0].split('?')[0];
let QR_CACHE='';function qrSvg(){if(QR_CACHE)return QR_CACHE;try{const q=qrcode(0,'M');q.addData(BOOK_URL);q.make();QR_CACHE=q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){QR_CACHE=''}return QR_CACHE}

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const durTxt=m=>T().dur(m);
const svc=id=>SERVICES.find(s=>s.id===id);
const sName=id=>T().svc[id];
const brb=id=>BARBERS.find(b=>b.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseYmd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function niceDate(s){return T().niceDate(parseYmd(s),T())}
const eur=v=>LANG==='en'?`€${v}`:`${v} €`;

const now=new Date();
const todayStr=ymd(now);
const nowMin=now.getHours()*60+now.getMinutes();
const DAYS=[];for(let i=0;i<14;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);DAYS.push(ymd(d))}

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const NAMES=['Lukas','Tomas','Mantas','Jonas','Dovydas','Paulius','Karolis','Matas','Andrius','Rokas','Emil','Arnas','Deividas','Vytautas','Oskar'];
let bookings=[];let seq=1;
DAYS.forEach((day,di)=>{
  const load=di<3?0.7:di<7?0.5:0.25;
  BARBERS.forEach((b,bi)=>{
    const r=rng(di*31+bi*7+11);let t=OPEN+Math.floor(r()*4)*15;
    while(t<CLOSE-30){
      const s=SERVICES[Math.floor(r()*SERVICES.length)];
      if(t+s.min>CLOSE)break;
      if(r()<load){bookings.push({id:seq++,barber:b.id,service:s.id,date:day,start:t,name:NAMES[Math.floor(r()*NAMES.length)],phone:'+370 6'+Math.floor(1000000+r()*8999999),kind:'example',status:'ok'});t+=s.min+(r()<.5?0:15)}
      else t+=15*(2+Math.floor(r()*4));
    }
  });
});

function busy(barber,date,start,len){
  return bookings.some(b=>b.barber===barber&&b.date===date&&b.status!=='cancelled'&&start<b.start+(b.len||svc(b.service).min)&&b.start<start+len);
}
function freeBarbers(date,start,len,which){
  const list=which==='any'?BARBERS.map(b=>b.id):[which];
  return list.filter(id=>!busy(id,date,start,len));
}
function slotsFor(date,len,which){
  const out=[];for(let t=OPEN;t+len<=CLOSE;t+=STEP){
    if(date===todayStr&&t<nowMin+30)continue;
    if(freeBarbers(date,t,len,which).length)out.push(t);
  }return out;
}
function dayBtn(d,attr,pressed,disabled,label){const dt=parseYmd(d),t=T();
  return `<button class="day" ${attr}="${d}" aria-pressed="${pressed}" ${disabled?'disabled':''} aria-label="${label}"><small>${t.dow[dt.getDay()]}</small><b>${dt.getDate()}</b><small>${t.monS[dt.getMonth()]}</small></button>`}

/* ---------- Client flow ---------- */
const st={step:0,service:null,barber:null,date:null,time:null,name:'',phone:'',email:'',note:'',errors:{},done:null};
const client=document.getElementById('client');
function firstDayWithSlots(){const len=svc(st.service).min;return DAYS.find(d=>slotsFor(d,len,st.barber).length)||DAYS[0]}

function renderClient(){
  const t=T();
  if(st.done){client.innerHTML=doneView();bindDone();return}
  const steps=t.steps.map((s,i)=>`<span class="${i===st.step?'on':i<st.step?'done':''}">${i+1}. ${s}</span>`).join('');
  let body='';
  if(st.step===0){
    body=`<h2>${t.pickSvc}</h2><div class="list">${SERVICES.map(s=>`
      <button class="opt" data-svc="${s.id}" aria-pressed="${st.service===s.id}">
        <div class="main"><div class="t">${sName(s.id)}</div><div class="s">${durTxt(s.min)}</div></div>
        <div class="p">${eur(s.price)}</div></button>`).join('')}</div>`;
  }else if(st.step===1){
    body=`<h2>${t.pickBrb}</h2><div class="list">
      <button class="opt" data-brb="any" aria-pressed="${st.barber==='any'}"><div class="avatar any">✂</div><div class="main"><div class="t">${t.any}</div><div class="s">${t.anyS}</div></div></button>
      ${BARBERS.map(b=>`<button class="opt" data-brb="${b.id}" aria-pressed="${st.barber===b.id}"><div class="avatar">${b.name[0]}</div><div class="main"><div class="t">${b.name}</div><div class="s">${t.role[b.role]}</div></div></button>`).join('')}</div>`;
  }else if(st.step===2){
    const len=svc(st.service).min;
    if(!st.date)st.date=firstDayWithSlots();
    const days=DAYS.map(d=>{const n=slotsFor(d,len,st.barber).length;return dayBtn(d,'data-day',st.date===d,!n,niceDate(d)+(n?'':t.noSlotsDay))}).join('');
    const sl=slotsFor(st.date,len,st.barber);
    const groups=[[0,0,720],[1,720,1020],[2,1020,1440]].map(([n,a,b])=>{
      const g=sl.filter(x=>x>=a&&x<b);if(!g.length)return'';
      return `<div class="part">${t.parts[n]}</div><div class="slots">${g.map(x=>`<button class="slot" data-t="${x}" aria-pressed="${st.time===x}">${hm(x)}</button>`).join('')}</div>`}).join('');
    body=`<h2>${t.pickTime}</h2><div class="days">${days}</div>
      <h3>${niceDate(st.date)}</h3>${groups||`<div class="empty">${t.noSlots}</div>`}`;
  }else{
    const e=st.errors;
    body=`<h2>${t.you}</h2>
      <div class="field"><label for="f-name">${t.name}</label><input id="f-name" autocomplete="given-name" value="${esc(st.name)}">${e.name?`<span class="err">${t[e.name]}</span>`:''}</div>
      <div class="field"><label for="f-phone">${t.phone}</label><input id="f-phone" type="tel" autocomplete="tel" placeholder="+370 6xx xxxxx" value="${esc(st.phone)}">${e.phone?`<span class="err">${t[e.phone]}</span>`:`<span style="font-size:12px;color:var(--muted)">${t.phoneHint}</span>`}</div>
      <div class="field"><label for="f-email">${t.email}</label><input id="f-email" type="email" autocomplete="email" inputmode="email" placeholder="vardas@gmail.com" value="${esc(st.email)}">${e.email?`<span class="err">${t[e.email]}</span>`:`<span style="font-size:12px;color:var(--muted)">${t.emailHint}</span>`}</div>
      <div class="field"><label for="f-note">${t.note}</label><textarea id="f-note" rows="2">${esc(st.note)}</textarea></div>`;
  }
  const canNext=[st.service,st.barber,st.time!=null,true][st.step];
  const nav=`<div class="nav">${st.step>0?`<button class="btn ghost" id="back">${t.back}</button>`:'<span></span>'}
    <button class="btn ${st.step===3?'red':''}" id="next" ${canNext?'':'disabled'}>${st.step===3?t.confirm:t.next}</button></div>`;
  client.innerHTML=`<div class="grid"><section class="panel"><div class="steps">${steps}</div>${body}${nav}</section>${summary()}</div>`;
  bindClient();
}
function summary(){
  const t=T(),s=st.service&&svc(st.service);
  const who=st.barber==='any'?t.any:st.barber?brb(st.barber).name:'—';
  return `<aside class="panel summary"><h3>${t.visit}</h3>
    <div class="sum-row"><span>${t.service}</span><span>${s?sName(s.id):'—'}</span></div>
    <div class="sum-row"><span>${t.duration}</span><span>${s?durTxt(s.min):'—'}</span></div>
    <div class="sum-row"><span>${t.barberL}</span><span>${who}</span></div>
    <div class="sum-row"><span>${t.time}</span><span>${st.time!=null?`${st.date.slice(5).replace('-','.')} · ${hm(st.time)}`:'—'}</span></div>
    <div class="sum-total"><span>${t.payIn}</span><b>${s?eur(s.price):'—'}</b></div>
    <p class="info">${t.infoS}</p></aside>`;
}
function bindClient(){
  client.querySelectorAll('[data-svc]').forEach(b=>b.onclick=()=>{if(st.service!==b.dataset.svc){st.service=b.dataset.svc;st.date=null;st.time=null}st.step=1;renderClient()});
  client.querySelectorAll('[data-brb]').forEach(b=>b.onclick=()=>{if(st.barber!==b.dataset.brb){st.barber=b.dataset.brb;st.date=null;st.time=null}st.step=2;renderClient()});
  client.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{st.date=b.dataset.day;st.time=null;renderClient()});
  client.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{st.time=+b.dataset.t;renderClient()});
  const back=client.querySelector('#back');if(back)back.onclick=()=>{saveFields();st.step--;renderClient()};
  client.querySelector('#next').onclick=()=>{
    if(st.step<3){st.step++;renderClient();return}
    saveFields();
    const e={};if(st.name.trim().length<2)e.name='errName';
    if(st.phone.replace(/\D/g,'').length<8)e.phone='errPhone';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(st.email.trim()))e.email='errEmail';
    st.errors=e;if(Object.keys(e).length){renderClient();return}
    const len=svc(st.service).min;const free=freeBarbers(st.date,st.time,len,st.barber);
    if(!free.length){st.step=2;st.time=null;renderClient();toast(T().taken);return}
    const b={id:seq++,barber:free[0],service:st.service,date:st.date,start:st.time,name:st.name.trim(),phone:st.phone.trim(),email:st.email.trim(),note:st.note.trim(),kind:'new',status:'ok'};
    bookings.push(b);st.done=b;renderClient();renderAdmin();
  };
}
function saveFields(){const n=client.querySelector('#f-name');if(n){st.name=n.value;st.phone=client.querySelector('#f-phone').value;st.email=client.querySelector('#f-email').value;st.note=client.querySelector('#f-note').value}}
function doneView(){
  const t=T(),b=st.done,s=svc(b.service);
  return `<section class="panel done-box" style="max-width:560px;margin:0 auto">
    <span class="pill ok">${t.confirmed}</span>
    <h2 style="margin-top:12px">${t.seeYou(esc(b.name))}</h2>
    <p>${sName(s.id)} ${t.with} <strong>${brb(b.barber).name}</strong><br>${niceDate(b.date)}, ${hm(b.start)}–${hm(b.start+s.min)}</p>
    <div class="code" aria-label="${t.code}">BC-${String(b.id).padStart(4,'0')}</div>
    <p>${t.sentTo(esc(b.email))}</p>
    <p class="info" style="margin-top:0">${t.noSms}</p>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn ghost" id="again">${t.again}</button>
      ${IS_ADMIN()?`<button class="btn" id="see">${t.see}</button>`:''}</div></section>`;
}
function bindDone(){
  client.querySelector('#again').onclick=()=>{Object.assign(st,{step:0,service:null,barber:null,date:null,time:null,name:'',phone:'',email:'',note:'',errors:{},done:null});renderClient()};
  const see=client.querySelector('#see');if(see)see.onclick=()=>{ad.date=st.done.date;ad.sel=st.done.id;setMode('admin')};
}

/* ---------- Dashboard ---------- */
const ad={date:todayStr,sel:null,per:25,commission:20,newc:60,avg:null,plan:0,blocking:false};
const admin=document.getElementById('admin');
const PX=1.1;
function monthStats(){
  const m=todayStr.slice(0,7);
  const list=bookings.filter(b=>b.date.startsWith(m)&&b.status==='ok'&&b.service);
  return {count:list.length,rev:list.reduce((a,b)=>a+svc(b.service).price,0),fresh:bookings.filter(b=>b.kind==='new').length};
}
function renderAdmin(){
  const t=T(),ms=monthStats();
  const dayList=bookings.filter(b=>b.date===ad.date&&b.status!=='cancelled');
  const dayRev=dayList.filter(b=>b.service&&b.status==='ok').reduce((a,b)=>a+svc(b.service).price,0);
  const H=(CLOSE-OPEN)*PX;
  const hours=[];for(let x=OPEN;x<=CLOSE;x+=60)hours.push(x);
  const cols=BARBERS.map(br=>{
    const items=dayList.filter(b=>b.barber===br.id).map(b=>{
      const len=b.len||svc(b.service).min;const cls=b.kind==='block'?'block':b.status==='noshow'?'noshow':b.kind==='new'?'new':'';
      const label=b.kind==='block'?t.blocked:esc(b.name);
      return `<button class="appt ${cls}" data-id="${b.id}" aria-pressed="${ad.sel===b.id}" style="top:${(b.start-OPEN)*PX+1}px;height:${len*PX-2}px"><b>${hm(b.start)} ${label}</b>${b.service?sName(b.service):''}</button>`}).join('');
    const lines=hours.map(x=>`<div class="gl" style="top:${(x-OPEN)*PX}px"></div>`).join('');
    const nowLine=ad.date===todayStr&&nowMin>=OPEN&&nowMin<=CLOSE?`<div class="now" style="top:${(nowMin-OPEN)*PX}px"></div>`:'';
    return `<div class="col" style="height:${H}px">${lines}${nowLine}${items}</div>`}).join('');
  const heads=BARBERS.map(b=>`<div class="head"><span class="avatar">${b.name[0]}</span>${b.name}<span style="margin-left:auto;font-weight:500;color:var(--muted);font-size:12px">${dayList.filter(x=>x.barber===b.id&&x.service).length} ${t.vShort}</span></div>`).join('');
  const days=DAYS.map(d=>dayBtn(d,'data-aday',ad.date===d,false,niceDate(d))).join('');
  const sel=bookings.find(b=>b.id===ad.sel&&b.status!=='cancelled');
  const avgP=ad.avg??(()=>{const v=SERVICES.map(s=>s.price).sort((x,y)=>x-y),m=v.length>>1;return Math.round(v.length%2?v[m]:(v[m-1]+v[m])/2)})();const tw=Math.round(ad.newc*avgP*ad.commission/100+ad.plan);const fee=ad.per*BARBERS.length;

  admin.innerHTML=`
  <div class="stats">
    <div class="stat"><small>${t.sMonth}</small><b>${ms.count}</b><div class="note">${eur(ms.rev)} ${t.sTurn}</div></div>
    <div class="stat"><small>${t.sDay}</small><b>${eur(dayRev)}</b><div class="note">${dayList.filter(b=>b.service).length} ${t.sVisits}</div></div>
    <div class="stat"><small>${t.sNew}</small><b>${ms.fresh}</b><div class="note">${t.sNewN}</div></div>
    <div class="stat"><small>${t.sCom}</small><b>${eur(0)}</b><div class="note">${t.sFee(BARBERS.length,ad.per)}</div></div>
  </div>
  <div class="dash-grid">
    <section>
      <div class="days">${days}</div>
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">${niceDate(ad.date)}</h3>
        <button class="btn ghost" id="blk" style="padding:7px 12px;font-size:13px">${ad.blocking?t.close:t.blockT}</button></div>
      ${ad.blocking?blockForm():''}
      <div class="sched-wrap"><div class="sched" style="grid-template-columns:52px repeat(${BARBERS.length},minmax(150px,1fr))">
        <div class="head" style="padding:10px 0"></div>${heads}
        <div class="hours" style="height:${H}px">${hours.map(x=>`<div style="top:${(x-OPEN)*PX}px">${hm(x)}</div>`).join('')}</div>${cols}
      </div></div>
      <div class="legend"><span><i style="background:var(--navy-soft);border-left:3px solid var(--navy)"></i>${t.lgEx}</span><span><i style="background:var(--red-soft);border-left:3px solid var(--red)"></i>${t.lgNew}</span><span><i style="background:var(--line)"></i>${t.lgBlk}</span></div>
    </section>
    <div class="side">
      ${sel?detail(sel):`<div class="panel"><h3>${t.visitH}</h3><p class="info" style="margin:0">${t.visitHint}</p></div>`}
      <div class="panel"><h3>${t.twH}</h3>
        <div class="inline-fields">
          <div class="field"><label for="f-newc">${t.newC}</label><input id="f-newc" type="number" min="0" value="${ad.newc}"></div>
          <div class="field"><label for="f-avg">${t.avg}</label><input id="f-avg" type="number" min="0" value="${avgP}"></div>
          <div class="field"><label for="f-plan">${t.plan}</label><input id="f-plan" type="number" min="0" value="${ad.plan}"></div>
          <div class="field"><label for="f-com">${t.com}</label><input id="f-com" type="number" min="0" max="60" value="${ad.commission}"></div>
          <div class="field"><label for="f-fee">${t.ourFee}</label><input id="f-fee" type="number" min="0" value="${ad.per}"></div>
        </div>
        <p class="info" style="margin:0">${t.twBase(ad.newc,avgP,ad.commission)}</p>
        <div class="cmp"><div class="bad"><small>Treatwell</small><b>${eur(tw)}</b></div><div class="good"><small>${t.ours}</small><b>${eur(fee)}</b></div></div>
        ${tw>fee?`<div class="save">${t.saved(tw-fee)}</div><p class="info" style="margin-top:4px">${t.yr((tw-fee)*12)}</p>`:`<p class="info" style="margin-top:10px">${t.cheaper}</p>`}
      </div>
      <div class="panel"><h3>${t.linkH}</h3>
        <div class="share"><input id="f-link" readonly value="${BOOK_URL}" aria-label="${t.linkH}"><button class="btn" id="copy" style="padding:9px 12px">${t.copy}</button></div>
        <p class="info">${t.linkInfo}</p><div class="qr"><div class="qr-box" role="img" aria-label="${t.qrAlt}">${qrSvg()}</div><p class="info">${t.qrInfo}</p></div></div>
    </div>
  </div>`;
  bindAdmin();
}
function blockForm(){
  const t=T(),opts=[];for(let x=OPEN;x<CLOSE;x+=15)opts.push(`<option value="${x}">${hm(x)}</option>`);
  return `<div class="panel" style="margin-bottom:12px"><div class="inline-fields" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
    <div class="field"><label for="b-brb">${t.bBarber}</label><select id="b-brb">${BARBERS.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select></div>
    <div class="field"><label for="b-start">${t.bFrom}</label><select id="b-start">${opts.join('')}</select></div>
    <div class="field"><label for="b-len">${t.bLen}</label><select id="b-len"><option value="30">30 min</option><option value="60" selected>1 ${t.h}</option><option value="120">2 ${t.h}</option><option value="240">4 ${t.h}</option></select></div>
  </div><button class="btn" id="b-save">${t.bSave}</button></div>`;
}
function detail(b){
  const t=T();
  if(b.kind==='block')return `<div class="panel"><h3>${t.blkH}</h3><p style="margin:0 0 12px">${brb(b.barber).name}, ${hm(b.start)}–${hm(b.start+b.len)}</p><button class="btn ghost" data-act="cancel">${t.unblock}</button></div>`;
  const s=svc(b.service);
  const pill=b.status==='noshow'?`<span class="pill ns">${t.pNo}</span>`:b.kind==='new'?`<span class="pill new">${t.pNew}</span>`:`<span class="pill ok">${t.pOk}</span>`;
  return `<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">${t.visitH}</h3>${pill}</div>
    <div style="font-weight:700;font-size:18px">${esc(b.name)}</div>
    <div style="font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-bottom:10px">${esc(b.phone)}${b.email?`<br>${esc(b.email)}`:''}</div>
    <div class="sum-row"><span>${t.service}</span><span>${sName(s.id)}</span></div>
    <div class="sum-row"><span>${t.time}</span><span>${hm(b.start)}–${hm(b.start+s.min)}</span></div>
    <div class="sum-row"><span>${t.barberL}</span><span>${brb(b.barber).name}</span></div>
    <div class="sum-row"><span>${t.price}</span><span>${eur(s.price)}</span></div>
    ${b.note?`<p class="info">“${esc(b.note)}”</p>`:''}
    <div class="row" style="margin-top:14px">${b.status==='noshow'?'':`<button class="btn ghost" data-act="noshow">${t.noshow}</button>`}<button class="btn ghost" data-act="cancel" style="color:var(--red)">${t.cancel}</button></div></div>`;
}
function bindAdmin(){
  const t=T();
  admin.querySelectorAll('[data-aday]').forEach(b=>b.onclick=()=>{ad.date=b.dataset.aday;ad.sel=null;renderAdmin()});
  admin.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{ad.sel=+b.dataset.id;renderAdmin()});
  admin.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const bk=bookings.find(x=>x.id===ad.sel);if(!bk)return;
    if(b.dataset.act==='cancel'){bk.status='cancelled';ad.sel=null;toast(bk.kind==='block'?t.tUnblocked:t.tCancelled)}
    else{bk.status='noshow';toast(t.tNoshow)}
    renderAdmin();if(!st.done)renderClient();
  });
  admin.querySelector('#blk').onclick=()=>{ad.blocking=!ad.blocking;renderAdmin()};
  const bs=admin.querySelector('#b-save');if(bs)bs.onclick=()=>{
    const barber=admin.querySelector('#b-brb').value,start=+admin.querySelector('#b-start').value;let len=+admin.querySelector('#b-len').value;
    len=Math.min(len,CLOSE-start);
    if(busy(barber,ad.date,start,len)){toast(t.tBusy);return}
    bookings.push({id:seq++,barber,date:ad.date,start,len,kind:'block',status:'ok'});ad.blocking=false;toast(t.tBlocked);renderAdmin();if(!st.done)renderClient();
  };
  const com=admin.querySelector('#f-com'),fee=admin.querySelector('#f-fee');
  com.onchange=()=>{ad.commission=Math.max(0,+com.value||0);renderAdmin()};
  [['#f-newc','newc'],['#f-avg','avg'],['#f-plan','plan']].forEach(([id,k])=>{const el=admin.querySelector(id);el.onchange=()=>{ad[k]=Math.max(0,+el.value||0);renderAdmin()}});
  fee.onchange=()=>{ad.per=Math.max(0,+fee.value||0);renderAdmin()};
  admin.querySelector('#copy').onclick=()=>{const i=admin.querySelector('#f-link');
    try{navigator.clipboard.writeText(i.value).then(()=>toast(t.tCopied),()=>{i.select();toast(t.tSelect)})}catch(e){i.select();toast(t.tSelect)}};
}

/* ---------- Shell ---------- */
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600)}
let MODE='client';
// Demo stage: both views visible. Later set SHOW_TABS=false so clients see booking only.
const SHOW_TABS=true;
const IS_ADMIN=()=>SHOW_TABS||['#skydelis','#dashboard'].includes(location.hash);
function setMode(m){
  MODE=m;
  document.getElementById('client').hidden=m!=='client';document.getElementById('admin').hidden=m!=='admin';
  document.getElementById('tab-client').setAttribute('aria-selected',m==='client');document.getElementById('tab-admin').setAttribute('aria-selected',m==='admin');
  if(m==='admin')renderAdmin();
}
function applyLang(){
  const t=T();
  document.documentElement.lang=LANG;
  document.title=LANG==='lt'?'Barber Club registracija':'Barber Club booking';
  document.getElementById('t-proto').textContent=t.proto;
  document.getElementById('t-addr').textContent=t.addr;
  document.getElementById('t-foot').textContent=t.foot;
  document.getElementById('tab-client').textContent=t.tabC;
  document.getElementById('tab-admin').textContent=t.tabA;
  document.getElementById('lang-lt').setAttribute('aria-pressed',LANG==='lt');
  document.getElementById('lang-en').setAttribute('aria-pressed',LANG==='en');
  saveFields();renderClient();renderAdmin();
}
function setLang(l){LANG=l;try{localStorage.setItem('bc-lang',l)}catch(e){}applyLang()}
document.getElementById('lang-lt').onclick=()=>setLang('lt');
document.getElementById('lang-en').onclick=()=>setLang('en');
document.getElementById('tab-client').onclick=()=>setMode('client');
document.getElementById('tab-admin').onclick=()=>setMode('admin');
function syncAdmin(){const a=IS_ADMIN();document.getElementById('modes').hidden=!a;setMode(['#skydelis','#dashboard'].includes(location.hash)?'admin':'client');renderClient()}
window.addEventListener('hashchange',syncAdmin);
applyLang();syncAdmin();
</script>

</body>
