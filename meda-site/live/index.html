let SERVICES = [], BARBERS = [], SET = null, BUSY = [], DAYS = [], HOURS = [];

const svc = id => SERVICES.find(s => s.id === id);
const sName = s => svcName(s);
const brb = id => BARBERS.find(b => b.id === id);

async function loadBusy() {
  const { data, error } = await sb.rpc('busy_slots', { p_from: DAYS[0], p_to: DAYS[DAYS.length - 1] });
  if (error) throw error;
  BUSY = data || [];
}
async function loadAll() {
  loadState = 'loading'; render();
  try {
    const [s, b, c, h] = await Promise.all([
      sb.from('services').select('*').eq('active', true).order('sort'),
      sb.from('barbers').select('id,name,role,sort,about,photo,gallery').order('sort'),
      sb.from('settings').select('*').limit(1),
      sb.from('barber_hours').select('*')
    ]);
    for (const r of [s, b, c, h]) if (r.error) throw r.error;
    SERVICES = s.data; BARBERS = b.data; SET = c.data[0]; HOURS = h.data || [];
    const today = shopNow().date, n = Math.min(29, SET.days_ahead + 1);
    DAYS = Array.from({ length: n }, (_, i) => addDays(today, i));
    await loadBusy();
    sb.rpc('public_ratings').then(({ data }) => { if (data) { PR = data; render(); } });
    if (BARBERS.length === 1) st.barber = BARBERS[0].id;
    loadState = 'ok';
  } catch (e) { console.error(e); loadState = 'error'; }
  render();
}

function busy(barber, date, start, len) {
  return BUSY.some(b => b.barber_id === barber && b.day === date && start < b.end_min && b.start_min < start + len);
}
function works(barber, date, start, len) {
  const dow = parseYmd(date).getDay();
  return HOURS.some(h => h.barber_id === barber && h.dow === dow && start >= h.start_min && start + len <= h.end_min);
}
function freeBarbers(date, start, len, which) {
  return (which === 'any' ? BARBERS.map(b => b.id) : [which]).filter(id => works(id, date, start, len) && !busy(id, date, start, len));
}
function slotsFor(date, len, which) {
  const now = shopNow(), out = [];
  for (let t = 0; t + len <= 1440; t += SET.step_min) {
    if (date === now.date && t < now.min + SET.lead_min) continue;
    if (freeBarbers(date, t, len, which).length) out.push(t);
  }
  return out;
}
const firstDayWithSlots = () => DAYS.find(d => slotsFor(d, svc(st.service).minutes, st.barber).length) || DAYS[0];
const nf = (x, d = 1) => x.toLocaleString(LANG === 'en' ? 'en-GB' : 'lt-LT', { minimumFractionDigits: d, maximumFractionDigits: d });
function overall() {

}

const brbRating = id => { const r = PR && PR.barbers.find(x => x.id === id); return r && r.n ? { n: r.n, avg: Number(r.avg) } : null; };

    ${b.photo ? `<img class="avatar tm-av" src="${esc(media(b.photo))}" alt="${esc(b.name)}" width="112" height="112" loading="lazy">` : `<div class="avatar tm-av" aria-hidden="true">${esc(b.name[0])}</div>`}

      ${b.about ? `<p>${esc(b.about)}</p>` : ''}
      <button type="button" class="btn red" id="team-book">${t.book}</button></div>
    ${gal ? `<div class="gal">${gal}</div>` : ''}</div></section>`;
}

function openPhoto(i) {
  const b = brb(teamSel), g = gl(b); if (!g.length) return;
  let d = document.getElementById('lb'); if (!d) { d = document.createElement('dialog'); d.id = 'lb'; d.className = 'lb'; document.body.appendChild(d); }
  const show = k => { i = (k + g.length) % g.length; d.innerHTML = `<img src="${esc(media(g[i]))}" alt=""><button class="lb-x" aria-label="×">×</button>${g.length > 1 ? '<button class="lb-p" aria-label="‹">‹</button><button class="lb-n" aria-label="›">›</button>' : ''}`;
    d.querySelector('.lb-x').onclick = () => d.close(); const pv = d.querySelector('.lb-p'), nx = d.querySelector('.lb-n');

  show(i); d.showModal();
}

  const t = T(), b = document.getElementById('rating-btn'), o = overall();
  if (!o) { b.hidden = true; return; }
  b.hidden = false; b.setAttribute('aria-expanded', String(revOpen));
  b.innerHTML = `<span class="stars-s">★</span> <b>${nf(o.avg)}</b> · ${t.revs(o.n)}`;
  b.onclick = () => { revOpen = !revOpen; render(); if (revOpen) document.getElementById('reviews')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
}
const revF = { brb: '', svc: '', stars: [] };
function reviewsHtml() {
  if (!revOpen || !overall()) return '';
  const t = T(), o = overall(), rec = PR ? PR.recent : [];
  const own = PR && PR.dist ? PR.dist : [0, 0, 0, 0, 0];
  const dist = [0, 1, 2, 3, 4].map(i => own[i] || 0), dmax = Math.max(1, ...dist);
  const list = rec.filter(r => (!revF.brb || r.barber_id === revF.brb) && (!revF.svc || r.service_id === revF.svc) && (!revF.stars.length || revF.stars.includes(r.stars)));
  const brbOpts = BARBERS.map(b => { const r = brbRating(b.id); return `<option value="${esc(b.id)}" ${revF.brb === b.id ? 'selected' : ''}>${esc(b.name)}${r ? ` · ★ ${nf(r.avg)}` : ''}</option>`; }).join('');
  const svcIds = [...new Set(rec.map(r => r.service_id))];
  const svcOpts = SERVICES.filter(x => svcIds.includes(x.id)).map(x => `<option value="${esc(x.id)}" ${revF.svc === x.id ? 'selected' : ''}>${esc(sName(x))}</option>`).join('');
  const starRows = [5, 4, 3, 2, 1].map((n, i) => `<label class="rf-star"><input type="checkbox" data-rstar="${n}" ${revF.stars.includes(n) ? 'checked' : ''}>${starsHtml(n)}<span class="rf-bar"><span style="width:${(dist[i] / dmax * 100).toFixed(1)}%"></span></span><span class="rf-n">${dist[i]}</span></label>`).join('');
  const items = list.slice(0, 60).map(r => { const sv = svc(r.service_id);
    return `<div class="rev">${starsHtml(r.stars)}<p>${esc(r.comment)}</p><div class="rev-meta">${BARBERS.length > 1 ? `${t.revBy} ${esc((brb(r.barber_id) || {}).name || '')}` : ''}${sv ? ` <span class="rev-tag">${esc(sName(sv))}</span>` : ''}</div><div class="rev-who"><b>${esc(r.name || '')}</b> · ${shortDate(r.day)}<span class="rev-ok">✓ ${t.revVer}</span></div></div>`; }).join('');
  const any = revF.brb || revF.svc || revF.stars.length;
  return `<section class="panel reviews" id="reviews"><div class="rev-head"><h2>${t.revTitle}</h2><button type="button" class="btn ghost" id="rev-close">${t.revClose}</button></div>
    <div class="rev-big"><b>${nf(o.avg)}</b><div>${starsFrac(o.avg)}<div class="rev-sub">${t.revs(o.n)}</div></div></div>
    <div class="rev-grid"><aside class="rev-filters">
      ${BARBERS.length > 1 ? `<label class="rf-l" for="rf-b">${t.revFBrb}</label><select id="rf-b"><option value="">${t.revAll}</option>${brbOpts}</select>` : ''}
      ${svcOpts ? `<label class="rf-l" for="rf-s">${t.revFSvc}</label><select id="rf-s"><option value="">${t.revAllS}</option>${svcOpts}</select>` : ''}
      <div class="rf-l">${t.revFStar}</div>${starRows}
      ${any ? `<button type="button" class="btn ghost" id="rf-clear" style="margin-top:10px;width:100%">${t.revClear}</button>` : ''}
      <p class="rev-sub" style="margin-top:12px">${t.revNote}</p></aside>
    <div class="rev-list">${items || `<p class="info">${rec.length ? t.revNoMatch : t.revNone}</p>`}</div></div></section>`;
}
function bindReviews() {
  if (!document.querySelector('.rev-filters')) return;
  const b = document.getElementById('rf-b'); if (b) b.onchange = () => { revF.brb = b.value; render(); };
  const sv = document.getElementById('rf-s'); if (sv) sv.onchange = () => { revF.svc = sv.value; render(); };
  document.querySelectorAll('[data-rstar]').forEach(c => c.onchange = () => { const n = +c.dataset.rstar; revF.stars = c.checked ? [...revF.stars, n] : revF.stars.filter(x => x !== n); render(); });
  const cl = document.getElementById('rf-clear'); if (cl) cl.onclick = () => { revF.brb = ''; revF.svc = ''; revF.stars = []; render(); };
}
const firstStep = () => BARBERS.length === 1 ? [0, 2, 3] : [0, 1, 2, 3];

function demoUi() {
  const t = T(), toBook = () => document.querySelector('.grid .panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('hero-t').textContent = t.heroT; document.getElementById('hero-s').textContent = t.heroS;
  const hb = document.getElementById('hero-b'); hb.textContent = t.book; hb.onclick = toBook;
  document.querySelector('.hero').classList.toggle('has-img', !!document.querySelector('#hero-track img'));
  const tbb = document.getElementById('tb-book'); tbb.textContent = t.book; tbb.onclick = toBook;
  const nb = document.getElementById('nav-book'); nb.textContent = t.navBook; nb.onclick = e => { e.preventDefault(); toBook(); };
  document.getElementById('nav-team').textContent = t.navTeam; document.getElementById('nav-info').textContent = t.navInfo;
  const nr = document.getElementById('nav-rev'); nr.textContent = t.navRev; nr.hidden = !overall();
  nr.onclick = e => { e.preventDefault(); if (!revOpen) { revOpen = true; render(); } document.getElementById('reviews')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  const panel = document.querySelector('.grid .panel'); if (panel) panel.id = 'book-panel';
}
function render() {
  const t = T();
  paintCommon();
  document.title = t.title;
  document.getElementById('t-foot').textContent = t.foot;
  document.getElementById('h1-sub').textContent = t.sub;
  document.getElementById('f-code').textContent = t.fCode;
  document.getElementById('f-shop').textContent = t.fShop;
  document.getElementById('t-priv').textContent = t.priv;
  for (const id of ['tb-tel', 'chip-tel', 'f-tel']) document.getElementById(id).href = TEL_HREF;
  document.getElementById('tb-tel').setAttribute('aria-label', SHOP_PHONE);
  for (const id of ['tb-tel-t', 'chip-tel-t', 'f-tel']) document.getElementById(id).textContent = SHOP_PHONE;
  paintRating();
  document.getElementById('map-l').textContent = t.mapL;
  const tr = document.getElementById('tw-rev'); document.getElementById('tw-rev-t').textContent = t.twRev; tr.href = t.twUrl;
  if (loadState === 'loading') { client.innerHTML = `<section class="panel"><p class="loading">${t.loading}</p></section>`; return; }
  if (loadState === 'error') { client.innerHTML = `<section class="panel"><p class="alert bad">${esc(t.loadErr)}</p><button class="btn" id="retry">${t.retry}</button></section>`; client.querySelector('#retry').onclick = loadAll; return; }
  if (st.done) { client.innerHTML = doneView(); bindDone(); return; }

  const visible = firstStep();
  const steps = visible.map((s, i) => s < st.step
    ? `<button type="button" class="done" data-go="${s}">${i + 1}. ${t.steps[s]}</button>`
    : `<span class="${s === st.step ? 'on' : ''}" ${s === st.step ? 'aria-current="step"' : ''}>${i + 1}. ${t.steps[s]}</span>`).join('');
  let body = '';
  if (st.step === 0) {
    const cats = [...CATS, 'other'].filter(c => SERVICES.some(s => catOf(s) === c));
    if (st.service && svc(st.service)) st.cat = st.cat || catOf(svc(st.service));
    if (!cats.includes(st.cat)) st.cat = cats[0];
    body = `<h2>${t.pickSvc}</h2>${cats.length > 1 ? `<div class="cats" role="tablist">${cats.map(c => `<button type="button" role="tab" data-cat="${c}" aria-selected="${st.cat === c}">${t.cat[c]}</button>`).join('')}</div>` : ''}
      <div class="menu">${SERVICES.filter(s => catOf(s) === st.cat).map(s => `
      <button class="menu-i" data-svc="${esc(s.id)}" aria-pressed="${st.service === s.id}">
        <span class="mi-name">${esc(sName(s))}</span><span class="mi-lead" aria-hidden="true"></span><span class="mi-p">${eur(s.price)}</span>
        <span class="mi-d">${t.dur(s.minutes)}</span></button>`).join('')}</div>`;
  } else if (st.step === 1) {
    body = `<h2>${t.pickBrb}</h2><div class="list">
      <button class="opt" data-brb="any" aria-pressed="${st.barber === 'any'}"><div class="avatar any" aria-hidden="true">✂</div><div class="main"><div class="t">${t.any}</div><div class="s">${t.anyS}</div></div></button>
      ${BARBERS.map(b => `<button class="opt" data-brb="${esc(b.id)}" aria-pressed="${st.barber === b.id}">${avatar(b)}<div class="main"><div class="t">${esc(b.name)}</div><div class="s">${t.role[b.role] || ''}${brbRating(b.id) ? ` · <span class="stars-s">★</span> ${nf(brbRating(b.id).avg)} (${brbRating(b.id).n})` : ''}</div></div></button>`).join('')}</div>`;
  } else if (st.step === 2) {
    const len = svc(st.service).minutes;
    if (!st.date) st.date = firstDayWithSlots();
    const days = DAYS.map(d => { const n = slotsFor(d, len, st.barber).length; return dayBtn(d, 'data-day', st.date === d, !n, niceDate(d) + (n ? '' : t.noSlotsDay)); }).join('');
    const sl = slotsFor(st.date, len, st.barber);
    const groups = [[0, 0, 720], [1, 720, 1020], [2, 1020, 1440]].map(([n, a, b]) => {
      const g = sl.filter(x => x >= a && x < b); if (!g.length) return '';
      return `<div class="part">${t.parts[n]}</div><div class="slots">${g.map(x => `<button class="slot" data-t="${x}" aria-pressed="${st.time === x}">${hm(x)}</button>`).join('')}</div>`;
    }).join('');
    body = `<h2>${t.pickTime}</h2><div class="days">${days}</div><h3>${niceDate(st.date)}</h3>${groups || `<div class="empty">${t.noSlots}</div>`}`;
  } else {
    const e = st.errors;
    const fld = (k, label, attrs, hint) => `<div class="field"><label for="f-${k}">${label}</label><input id="f-${k}" name="${k}" ${attrs} ${e[k] ? `aria-invalid="true" aria-describedby="e-${k}"` : ''} value="${esc(st[k])}">${e[k] ? `<span class="err" id="e-${k}">${t[e[k]]}</span>` : hint ? `<span style="font-size:12px;color:var(--muted)">${hint}</span>` : ''}</div>`;
    body = `<h2>${t.you}</h2>
      ${fld('name', t.name, 'autocomplete="given-name" maxlength="60"', '')}
      ${fld('phone', t.phone, 'type="tel" autocomplete="tel" inputmode="tel" spellcheck="false" maxlength="20" placeholder="+370 612 34567"', t.phoneHint)}
      ${fld('email', t.email, 'type="email" autocomplete="email" inputmode="email" spellcheck="false" maxlength="120" placeholder="vardas@gmail.com"', t.emailHint)}
      <p class="priv-note">${t.privNote}</p><div class="field"><label for="f-note">${t.note}</label><textarea id="f-note" name="note" autocomplete="off" rows="2" maxlength="300" ${e.note ? 'aria-invalid="true" aria-describedby="e-note"' : ''}>${esc(st.note)}</textarea>${e.note ? `<span class="err" id="e-note">${t[e.note]}</span>` : ''}</div>`;
  }
  const canNext = [st.service, st.barber, st.time != null, !st.sending][st.step];
  const showBack = st.step > 0;
  const nav = `<div class="nav">${showBack ? `<button class="btn ghost" id="back">${t.back}</button>` : '<span></span>'}
    <button class="btn ${st.step === 3 ? 'red' : ''}" id="next" ${canNext ? '' : 'disabled'} ${st.sending ? 'aria-busy="true"' : ''}>${st.step === 3 ? (st.sending ? t.sending : t.confirm) : t.next}</button></div>`;
  client.innerHTML = `${reviewsHtml()}<div class="grid"><section class="panel"><div class="steps">${steps}</div>${body}${nav}</section>${summary()}</div>${teamHtml()}${infoHtml()}`;
  bindClient();
  const rc = document.getElementById('rev-close'); if (rc) rc.onclick = () => { revOpen = false; render(); };
  bindReviews();
  client.querySelectorAll('[data-team]').forEach(x => x.onclick = () => { teamSel = x.dataset.team; render(); });
  client.querySelectorAll('[data-gal]').forEach(x => x.onclick = () => openPhoto(+x.dataset.gal));
  const bookWith = id => { teamSel = id; if (st.barber !== id) { st.barber = id; st.date = null; st.time = null; } go(st.service ? 2 : 0); client.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  const tb = document.getElementById('team-book'); if (tb) tb.onclick = () => bookWith(teamSel);
  client.querySelectorAll('[data-book]').forEach(x => x.onclick = () => bookWith(x.dataset.book));
  demoUi();
}
function summary() {
  const t = T(), s = st.service && svc(st.service);
  const who = st.barber === 'any' ? t.any : st.barber ? brb(st.barber).name : '—';
  return `<aside class="panel summary"><h3>${t.visit}</h3>
    <div class="sum-row"><span>${t.service}</span><span>${s ? esc(sName(s)) : '—'}</span></div>
    <div class="sum-row"><span>${t.duration}</span><span>${s ? t.dur(s.minutes) : '—'}</span></div>
    ${BARBERS.length > 1 ? `<div class="sum-row"><span>${t.barberL}</span><span>${esc(who)}</span></div>` : ''}
    <div class="sum-row"><span>${t.time}</span><span>${st.time != null ? `${shortDate(st.date)} · ${hm(st.time)}` : '—'}</span></div>
    <div class="sum-total"><span>${t.payIn}</span><b>${s ? eur(s.price) : '—'}</b></div>
    <p class="info">${t.infoS}</p></aside>`;
}
function go(step) {
  st.step = step; render();
  if (step === 2) loadBusy().then(render).catch(() => {});
}
function bindClient() {
  const steps = firstStep();
  const nextOf = s => steps[steps.indexOf(s) + 1], prevOf = s => steps[steps.indexOf(s) - 1];
  client.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { st.cat = b.dataset.cat; render(); client.querySelector(`[data-cat="${st.cat}"]`)?.focus(); });
  client.querySelectorAll('[data-svc]').forEach(b => b.onclick = () => { if (st.service !== b.dataset.svc) { st.service = b.dataset.svc; st.date = null; st.time = null; } go(nextOf(0)); });
  client.querySelectorAll('[data-brb]').forEach(b => b.onclick = () => { if (st.barber !== b.dataset.brb) { st.barber = b.dataset.brb; st.date = null; st.time = null; } go(2); });
  client.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { st.date = b.dataset.day; st.time = null; render(); });
  client.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { st.time = +b.dataset.t; render(); });
  client.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { saveFields(); go(+b.dataset.go); });
  const back = client.querySelector('#back'); if (back) back.onclick = () => { saveFields(); go(prevOf(st.step)); };
  client.querySelector('#next').onclick = () => { if (st.step < 3) { go(nextOf(st.step)); return; } submit(); };
}
function saveFields() {
  const n = client.querySelector('#f-name');
  if (n) { st.name = n.value; st.phone = client.querySelector('#f-phone').value; st.email = client.querySelector('#f-email').value; st.note = client.querySelector('#f-note').value; }
}
function showErrors(e) {
  st.errors = e; render();
  const k = Object.keys(e)[0], el = client.querySelector('#f-' + k); if (el) el.focus();
  announce(Object.values(e).map(x => T()[x]).join(' '));
}
async function submit() {
  if (st.sending) return;
  saveFields();
  const e = {};
  if (st.name.trim().length < 2) e.name = 'errName';
  if (st.phone.replace(/\D/g, '').length < 8) e.phone = 'errPhone';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(st.email.trim())) e.email = 'errEmail';
  if (st.note.trim().length > 300) e.note = 'errNote';
  if (Object.keys(e).length) { showErrors(e); return; }
  st.errors = {}; st.sending = true; render();
  const { data, error } = await sb.rpc('create_booking', {
    p_service: st.service, p_barber: st.barber, p_day: st.date, p_start_min: st.time,
    p_name: st.name.trim(), p_phone: st.phone.trim(), p_email: st.email.trim(), p_note: st.note.trim() || null, p_lang: LANG
  });
  st.sending = false;
  if (error || !data || !data.length) {
    const c = errCode(error), t = T();
    if (c === 'bad_name') return showErrors({ name: 'errName' });
    if (c === 'bad_phone') return showErrors({ phone: 'errPhone' });
    if (c === 'bad_email') return showErrors({ email: 'errEmail' });
    if (c === 'bad_note') return showErrors({ note: 'errNote' });
    if (c === 'slot_taken' || c === 'too_soon' || c === 'bad_time' || c === 'bad_day') {
      st.time = null; go(2); toast(c === 'too_soon' ? t.tooSoon : t.taken); return;
    }
    render(); toast(c === 'too_many' ? t.tooMany : t.failed); return;
  }
  const r = data[0];
  if (EMAILS_ON) fetch(`${SUPABASE_URL}/functions/v1/send-emails`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: r.code }) }).catch(() => {});
  st.done = { code: r.code, barberName: r.barber_name, day: r.day, start: r.start_min, end: r.end_min, service: st.service, name: st.name.trim() };
  render(); client.focus();
}
function doneView() {
  const t = T(), d = st.done, s = svc(d.service);
  return `<section class="panel done-box" style="max-width:560px;margin:0 auto">
    <span class="pill ok">${t.confirmed}</span>
    <h2 style="margin-top:12px">${t.seeYou(esc(d.name))}</h2>
    <p>${esc(sName(s))}${BARBERS.length > 1 ? ` ${t.with} <strong>${esc(d.barberName)}</strong>` : ''}<br>${niceDate(d.day)}, ${hm(d.start)}–${hm(d.end)}</p>
    <div class="code" translate="no" aria-label="${t.code}">${esc(d.code)}</div>
    <p class="info" style="margin-top:0">${t.keep}</p>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" id="again">${t.again}</button></div></section>`;
}
function bindDone() {
  client.querySelector('#again').onclick = () => {
    Object.assign(st, { step: 0, cat: null, service: null, barber: BARBERS.length === 1 ? BARBERS[0].id : null, date: null, time: null, note: '', errors: {}, done: null });
    go(0);
  };
}

document.getElementById('skip').onclick = e => { e.preventDefault(); client.focus(); };
bindLangButtons(() => { saveFields(); render(); });
loadAll();
setInterval(() => { if (loadState === 'ok' && st.step === 2 && !document.hidden) loadBusy().then(render).catch(() => {}); }, 60000);
</script>
