const BOOK_URL = new URL('./', location.href).href;
const ZL = [[0.45, 78], [0.6, 95], [0.8, 115], [1.1, 150], [1.5, 180]];
let ZI = 3; try { const z = +localStorage.getItem('bc_zoom'); if (z >= 0 && z < ZL.length) ZI = z; } catch (e) {}
let PX = ZL[ZI][0];
let pinch = null;
document.addEventListener('touchstart', e => { if (e.touches.length === 2 && e.target.closest('.sched-wrap')) { const [a, b] = e.touches; pinch = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); } }, { passive: true });
document.addEventListener('touchmove', e => {
  if (pinch == null || e.touches.length !== 2) return;
  e.preventDefault();
  const [a, b] = e.touches, d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  if (d / pinch < 0.8 && ZI > 0) { pinch = d; setZoom(-1); } else if (d / pinch > 1.25 && ZI < ZL.length - 1) { pinch = d; setZoom(1); }
}, { passive: false });
document.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });
function setZoom(d) { ZI = Math.max(0, Math.min(ZL.length - 1, ZI + d)); PX = ZL[ZI][0]; try { localStorage.setItem('bc_zoom', ZI); } catch (e) {} renderDash(); }

const brb = id => BARBERS.find(b => b.id === id) || { name: id };

let QR = ''; function qrSvg() { if (QR) return QR; try { const q = qrcode(0, 'M'); q.addData(BOOK_URL); q.make(); QR = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) {} return QR; }

async function loadRef() {
  const [s, b, c, h, m] = await Promise.all([
    sb.from('services').select('*').order('sort'),
    sb.from('barbers').select('*').order('sort'),
    sb.from('settings').select('*').limit(1),
    sb.from('barber_hours').select('*'),
    sb.rpc('my_staff')
  ]);
  for (const r of [s, b, c, h, m]) if (r.error) throw r.error;
  SERVICES = s.data; BARBERS = b.data.filter(x => x.active); SET = c.data[0]; HOURS = h.data || []; ME = (m.data || [])[0] || null;
  const today = shopNow().date;
  FROM = addDays(today, -7); TO = addDays(today, 30);
  DAYS = Array.from({ length: 32 }, (_, i) => addDays(today, i - 3));
  if (!ad.date) ad.date = today;
}
async function loadRows() {
  const { data, error } = await sb.rpc('staff_bookings', { p_from: FROM, p_to: TO });
  if (error) throw error;
  ROWS = data || []; lastLoad = new Date();
}

const PUSH = { state: 'unknown', barber: null, reg: null, sub: null, busy: false };
const FN_NOTIFY = `${SUPABASE_URL}/functions/v1/notify`;
const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function b64u(s) { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function pushInit() {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) { PUSH.state = isIos && !standalone() ? 'ios' : 'no'; return; }
    PUSH.reg = await navigator.serviceWorker.register('sw.js');
    if (Notification.permission === 'denied') { PUSH.state = 'denied'; return; }
    PUSH.sub = await PUSH.reg.pushManager.getSubscription();
    if (PUSH.sub) { const { data } = await sb.rpc('my_push_sub', { p_endpoint: PUSH.sub.endpoint }); PUSH.barber = data || null; }
    PUSH.state = PUSH.sub && PUSH.barber ? 'on' : 'off';
  } catch (e) { console.error(e); PUSH.state = 'no'; }
}
async function pushOn(barber) {
  const t = T();
  PUSH.busy = true; render();
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { PUSH.state = perm === 'denied' ? 'denied' : 'off'; return; }
    const { publicKey } = await fetch(FN_NOTIFY).then(r => r.json());
    PUSH.sub = (await PUSH.reg.pushManager.getSubscription()) || await PUSH.reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(publicKey) });
    const k = PUSH.sub.toJSON().keys;
    const { error } = await sb.rpc('save_push_sub', { p_barber: barber, p_endpoint: PUSH.sub.endpoint, p_p256dh: k.p256dh, p_auth: k.auth, p_lang: LANG });
    if (error) throw error;
    PUSH.barber = barber; PUSH.state = 'on'; toast(t.tPushOn);
  } catch (e) { console.error(e); toast(t.tFail); }
  finally { PUSH.busy = false; render(); }
}
async function pushOff(silent) {
  try {
    if (PUSH.sub) { await sb.rpc('delete_push_sub', { p_endpoint: PUSH.sub.endpoint }); await PUSH.sub.unsubscribe(); }
    PUSH.sub = null; PUSH.barber = null; PUSH.state = 'off'; if (!silent) toast(T().tPushOff);
  } catch (e) { console.error(e); if (!silent) toast(T().tFail); }
  if (!silent) render();
}

}

    const args = { p_barber: admin.querySelector('#v-brb').value, p_service: admin.querySelector('#v-svc').value, p_day: ad.date,
      p_start_min: +admin.querySelector('#v-start').value, p_name: name, p_phone: admin.querySelector('#v-phone').value.trim() || null,
      p_note: admin.querySelector('#v-note').value.trim() || null, p_source: admin.querySelector('#v-src').value };
    ad.panel = null;
    act(() => sb.rpc('staff_create_booking', args), t.tAdded);
  };
  const hbSel = admin.querySelector('#h-brb'); if (hbSel) hbSel.onchange = () => { ad.hb = hbSel.value; render(); };
  admin.querySelectorAll('[data-hd]').forEach(c => c.onchange = () => {
    const d = c.dataset.hd; admin.querySelector(`[data-hs="${d}"]`).disabled = !c.checked; admin.querySelector(`[data-he="${d}"]`).disabled = !c.checked;
  });
  const hs = admin.querySelector('#h-save'); if (hs) hs.onclick = async () => {
    const out = [];
    for (const c of admin.querySelectorAll('[data-hd]')) {
      if (!c.checked) continue;
      const d = +c.dataset.hd, a = +admin.querySelector(`[data-hs="${d}"]`).value, e = +admin.querySelector(`[data-he="${d}"]`).value;
      if (e <= a) { toast(t.tFail); return; }
      out.push({ dow: d, start: a, end: e });
    }
    const barber = ad.hb;
    act(async () => {
      const r = await sb.rpc('set_hours', { p_barber: barber, p_hours: out }); if (r.error) return r;
      const h = await sb.from('barber_hours').select('*'); if (!h.error) HOURS = h.data || []; return h;
    }, t.tHours);
  };
  admin.querySelector('#z-out').onclick = () => setZoom(-1);
  admin.querySelector('#z-in').onclick = () => setZoom(1);
  admin.querySelector('#ref').onclick = () => act(async () => ({ error: null }), t.refreshed);
  const bs = admin.querySelector('#b-save'); if (bs) bs.onclick = () => {
    const barber = admin.querySelector('#b-brb').value, start = +admin.querySelector('#b-start').value;
    const len = Math.min(+admin.querySelector('#b-len').value, SET.close_min - start);
    ad.panel = null;
    act(() => sb.rpc('add_block', { p_barber: barber, p_day: ad.date, p_start_min: start, p_minutes: len }), t.tBlocked);
  };
  admin.querySelector('#copy').onclick = () => {
    const i = admin.querySelector('#f-link');
    try { navigator.clipboard.writeText(i.value).then(() => toast(t.tCopied), () => { i.select(); toast(t.tSelect); }); } catch (e) { i.select(); toast(t.tSelect); }
  };
}

document.getElementById('skip').onclick = e => { e.preventDefault(); admin.focus(); };
document.getElementById('logout').onclick = async () => { if (PUSH.state === 'on') await pushOff(true); await sb.auth.signOut(); session = null; ROWS = []; ad.sel = null; view = 'login'; render(); };
bindLangButtons(render);

(async () => {
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (!session && INVITE) { await new Promise(r => setTimeout(r, 800)); session = (await sb.auth.getSession()).data.session; }
  if (session && INVITE) { view = 'setpw'; render(); }
  else if (session) enter(); else { view = 'login'; render(); }
})();
setInterval(() => { if (view === 'dash' && !document.hidden && !busyAct && ad.view === 'cal' && !ad.panel && !ad.moving && !ad.pw && document.activeElement?.id !== 'q') loadRows().then(render).catch(() => {}); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && view === 'dash' && !ad.panel) loadRows().then(render).catch(() => {}); });
</script>
</body>
</html>
