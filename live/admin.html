const T = () => ({ ...COMMON[LANG], ...I18N[LANG] });
const admin = document.getElementById('admin');
const BOOK_URL = new URL('./', location.href).href;
const PX = 1.1;

let SERVICES = [], BARBERS = [], SET = null, ROWS = [], DAYS = [], HOURS = [], ME = null, FROM, TO;
let view = 'loading', session = null, lastLoad = null, busyAct = false;
const ad = { date: null, sel: null, panel: null, hb: null, moving: false };
const login = { email: '', err: '', sending: false };

const svc = id => SERVICES.find(s => s.id === id);
const sName = s => svcName(s);
const brb = id => BARBERS.find(b => b.id === id) || { name: id };

let QR = ''; function qrSvg() { if (QR) return QR; try { const q = qrcode(0, 'M'); q.addData(BOOK_URL); q.make(); QR = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) {} return QR; }

async function loadRef() {
  const [s, b, c, h, m] = await Promise.all([
    sb.from('services').select('*').order('sort'),
    sb.from('barbers').select('*').order('sort'),
    sb.from('settings').select('*').limit(1),
    sb.from('barber_hours').select('*'),
    sb.rpc('my_staff')
  ]);
  for (const r of [s, b, c, h, m]) if (r.error) throw r.error;
  SERVICES = s.data; BARBERS = b.data.filter(x => x.active); SET = c.data[0]; HOURS = h.data || []; ME = (m.data || [])[0] || null;
  const today = shopNow().date;
  FROM = addDays(today, -7); TO = addDays(today, 30);
  DAYS = Array.from({ length: 32 }, (_, i) => addDays(today, i - 3));
  if (!ad.date) ad.date = today;
}
async function loadRows() {
  const { data, error } = await sb.rpc('staff_bookings', { p_from: FROM, p_to: TO });
  if (error) throw error;
  ROWS = data || []; lastLoad = new Date();
}
async function enter() {
  view = 'loading'; render();
  try { await loadRef(); await loadRows(); view = 'dash'; }
  catch (e) {
    console.error(e);
    if (errCode(e) === 'not_staff') { await sb.auth.signOut(); session = null; login.err = 'notStaff'; view = 'login'; }
    else view = 'error';
  }
  render();
}

function render() {
  const t = T();
  paintCommon();
  document.title = t.title;
  const lo = document.getElementById('logout'); lo.hidden = !session; lo.textContent = t.logout;
  document.getElementById('who').textContent = session ? t.signedAs(session.user.email) : '';
  if (view === 'loading') { admin.innerHTML = `<section class="panel"><p class="loading">${t.loading}</p></section>`; return; }
  if (view === 'error') { admin.innerHTML = `<section class="panel"><p class="alert bad">${esc(t.loadErr)}</p><button class="btn" id="retry">${t.retry}</button></section>`; admin.querySelector('#retry').onclick = enter; return; }
  if (view === 'login') return renderLogin();
  renderDash();
}

function renderLogin() {
  const t = T();
  admin.innerHTML = `<section class="panel login"><h2>${t.loginH}</h2>
    ${login.err ? `<p class="alert bad" role="alert">${t[login.err]}</p>` : ''}
    <form id="lf" novalidate>
      <div class="field"><label for="l-email">${t.email}</label><input id="l-email" name="email" type="email" autocomplete="username" inputmode="email" spellcheck="false" required value="${esc(login.email)}"></div>
      <div class="field"><label for="l-pass">${t.pass}</label><input id="l-pass" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" ${login.sending ? 'disabled aria-busy="true"' : ''}>${login.sending ? t.logging : t.login}</button>
    </form><p class="info">${t.forgot}</p></section>`;
  admin.querySelector('#lf').onsubmit = async ev => {
    ev.preventDefault();
    login.email = admin.querySelector('#l-email').value.trim();
    const pass = admin.querySelector('#l-pass').value;
    if (!login.email || !pass) { login.err = 'badLogin'; render(); return; }
    login.sending = true; login.err = ''; render();
    const { data, error } = await sb.auth.signInWithPassword({ email: login.email, password: pass });
    login.sending = false;
    if (error || !data.session) { login.err = 'badLogin'; render(); admin.querySelector('#l-pass')?.focus(); return; }
    session = data.session; enter();
  };
  (login.email ? admin.querySelector('#l-pass') : admin.querySelector('#l-email')).focus();
}

function isNew(r) { return r.kind === 'booking' && Date.now() - new Date(r.created_at).getTime() < 864e5; }
function stats() {
  const today = shopNow().date, week = addDays(today, 7);
  const book = ROWS.filter(r => r.kind === 'booking' && r.status === 'confirmed');
  const td = book.filter(r => r.day === ad.date);
  return {
    today: td.length,
    rev: td.reduce((a, r) => a + Number(svc(r.service_id)?.price || 0), 0),
    week: book.filter(r => r.day >= today && r.day < week).length,
    fresh: ROWS.filter(isNew).length
  };
}

function renderDash() {
  const t = T(), now = shopNow(), s = stats();
  const OPEN = SET.open_min, CLOSE = SET.close_min, H = (CLOSE - OPEN) * PX;
  const dayList = ROWS.filter(r => r.day === ad.date);
  const hours = []; for (let x = OPEN; x <= CLOSE; x += 60) hours.push(x);
  const cols = BARBERS.map(br => {
    const items = dayList.filter(r => r.barber_id === br.id).map(r => {
      const top = Math.max(0, r.start_min - OPEN), bottom = Math.min(CLOSE, r.end_min) - OPEN;
      const cls = r.kind === 'block' ? 'block' : r.status === 'noshow' ? 'noshow' : isNew(r) ? 'new' : '';
      const label = r.kind === 'block' ? t.blocked : esc(r.client_name);
      return `<button class="appt ${cls}" data-id="${r.id}" aria-pressed="${ad.sel === r.id}" style="top:${top * PX + 1}px;height:${Math.max(18, (bottom - top) * PX - 2)}px"><b>${hm(r.start_min)} ${label}</b>${r.service_id ? esc(sName(svc(r.service_id))) : ''}</button>`;
    }).join('');
    const lines = hours.map(x => `<div class="gl" style="top:${(x - OPEN) * PX}px"></div>`).join('');
    const wh = HOURS.find(h => h.barber_id === br.id && h.dow === parseYmd(ad.date).getDay());
    const offs = (wh ? [[OPEN, Math.max(OPEN, Math.min(CLOSE, wh.start_min))], [Math.min(CLOSE, Math.max(OPEN, wh.end_min)), CLOSE]] : [[OPEN, CLOSE]])
      .filter(([a, b]) => b > a).map(([a, b]) => `<div class="off" style="top:${(a - OPEN) * PX}px;height:${(b - a) * PX}px">${!wh && a === OPEN ? `<span>${t.dayOff}</span>` : ''}</div>`).join('');
    const nowLine = ad.date === now.date && now.min >= OPEN && now.min <= CLOSE ? `<div class="now" style="top:${(now.min - OPEN) * PX}px"></div>` : '';
    return `<div class="col" style="height:${H}px">${offs}${lines}${nowLine}${items}</div>`;
  }).join('');
  const heads = BARBERS.map(b => `<div class="head"><span class="avatar" aria-hidden="true">${esc(b.name[0])}</span>${esc(b.name)}<span style="margin-left:auto;font-weight:500;color:var(--muted);font-size:12px">${dayList.filter(x => x.barber_id === b.id && x.kind === 'booking').length} ${t.vShort}</span></div>`).join('');
  const days = DAYS.map(d => { const n = ROWS.filter(r => r.day === d && r.kind === 'booking' && r.status === 'confirmed').length; return dayBtn(d, 'data-aday', ad.date === d, false, niceDate(d) + (n ? ` · ${n} ${t.vShort}` : ''), n); }).join('');
  const sel = ROWS.find(r => r.id === ad.sel);
  const upd = lastLoad ? t.updated(new Intl.DateTimeFormat(LOC[LANG], { hour: '2-digit', minute: '2-digit', timeZone: TZ }).format(lastLoad)) : '';

  admin.innerHTML = `
  <div class="stats">
    <div class="stat"><small>${ad.date === now.date ? t.sToday : `${t.sDay} · ${shortDate(ad.date)}`}</small><b>${s.today}</b></div>
    <div class="stat"><small>${ad.date === now.date ? t.sTodayRev : `${t.sDayRev} · ${shortDate(ad.date)}`}</small><b>${eur(s.rev)}</b></div>
    <div class="stat"><small>${t.sWeek}</small><b>${s.week}</b><div class="note">${t.vShort}</div></div>
    <div class="stat"><small>${t.sNew}</small><b>${s.fresh}</b></div>
  </div>
  <div class="dash-grid">
    <section>
      <div class="find"><label class="sr-only" for="q">${t.findL}</label><input id="q" type="search" name="q" autocomplete="off" spellcheck="false" placeholder="🔍 ${t.findPh}" value="${esc(ad.q || '')}"><div id="qres" aria-live="polite">${findHtml()}</div></div>
      <div class="days" id="days">${days}</div>
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">${niceDate(ad.date)}</h3>
        <div class="row"><span class="who">${upd}</span><button class="btn ghost" id="ref" style="padding:7px 12px;font-size:13px">${t.refresh}</button>
        <button class="btn" data-panel="visit" style="padding:7px 12px;font-size:13px" aria-pressed="${ad.panel === 'visit'}">${ad.panel === 'visit' ? t.close : t.addV}</button>
        <button class="btn ghost" data-panel="block" style="padding:7px 12px;font-size:13px" aria-pressed="${ad.panel === 'block'}">${ad.panel === 'block' ? t.close : t.blockT}</button>
        <button class="btn ghost" data-panel="hours" style="padding:7px 12px;font-size:13px" aria-pressed="${ad.panel === 'hours'}">${ad.panel === 'hours' ? t.close : t.hoursT}</button></div></div>
      ${ad.panel === 'block' ? blockForm() : ad.panel === 'visit' ? visitForm() : ad.panel === 'hours' ? hoursForm() : ''}
      ${dayList.length ? '' : `<p class="info" style="margin-top:0">${t.none}</p>`}
      <div class="sched-wrap"><div class="sched" style="grid-template-columns:52px repeat(${BARBERS.length},minmax(150px,1fr))">
        <div class="head" style="padding:10px 0"></div>${heads}
        <div class="hours" style="height:${H}px">${hours.map(x => `<div style="top:${(x - OPEN) * PX}px">${hm(x)}</div>`).join('')}</div>${cols}
      </div></div>
      <div class="legend"><span><i style="background:var(--navy-soft);border-left:3px solid var(--navy)"></i>${t.lgBook}</span><span><i style="background:var(--red-soft);border-left:3px solid var(--red)"></i>${t.lgNew}</span><span><i style="background:var(--line)"></i>${t.lgBlk}</span></div>
    </section>
    <div class="side">
      ${sel ? detail(sel) : `<div class="panel"><h3>${t.visitH}</h3><p class="info" style="margin:0">${t.visitHint}</p></div>`}
      <div class="panel"><h3>${t.linkH}</h3>
        <div class="share"><input id="f-link" name="booking_link" autocomplete="off" spellcheck="false" readonly value="${esc(BOOK_URL)}" aria-label="${t.linkH}"><button class="btn" id="copy" style="padding:9px 12px">${t.copy}</button></div>
        <p class="info">${t.linkInfo}</p><div class="qr"><div class="qr-box" role="img" aria-label="${t.qrAlt}">${qrSvg()}</div><p class="info">${t.qrInfo}</p></div></div>
    </div>
  </div>`;
  bindDash();
  const strip = admin.querySelector('#days'), cur = strip && strip.querySelector('[aria-pressed="true"]');
  if (cur) strip.scrollLeft = ad.scroll ?? Math.max(0, cur.offsetLeft - strip.clientWidth / 2 + cur.clientWidth / 2);
  if (strip) strip.onscroll = () => { ad.scroll = strip.scrollLeft; };
}
function findHtml() {
  const t = T(), raw = (ad.q || '').trim(); if (raw.length < 2) return '';
  const q = raw.toLowerCase(), code = raw.toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^BC/, ''), dig = raw.replace(/\D/g, '');
  const hits = ROWS.filter(r => r.kind === 'booking' && (
    (code.length >= 3 && String(r.code || '').replace(/[^A-Z0-9]/g, '').replace(/^BC/, '').includes(code)) ||
    String(r.client_name || '').toLowerCase().includes(q) ||
    (dig.length >= 4 && String(r.client_phone || '').replace(/\D/g, '').includes(dig))
  )).sort((a, b) => (a.day + hm(a.start_min)).localeCompare(b.day + hm(b.start_min))).slice(0, 8);
  if (!hits.length) return `<p class="info" style="margin:6px 0 0">${t.findNone}</p>`;
  return `<div class="list" style="margin-top:6px">${hits.map(r => `<button class="opt" data-hit="${r.id}" data-day="${r.day}"><div class="main"><div class="t">${esc(r.client_name)} · ${esc(brb(r.barber_id).name)}</div><div class="s">${shortDate(r.day)} ${hm(r.start_min)} · <span translate="no">${esc(r.code)}</span></div></div></button>`).join('')}</div>`;
}
function bindFind() {
  admin.querySelectorAll('[data-hit]').forEach(b => b.onclick = () => { ad.date = b.dataset.day; ad.sel = b.dataset.hit; ad.q = ''; ad.scroll = null; render(); });
}
function timeOpts(from, to, step, sel) { const o = []; for (let x = from; x <= to; x += step) o.push(`<option value="${x}" ${x === sel ? 'selected' : ''}>${hm(x)}</option>`); return o.join(''); }
function visitForm() {
  const t = T();
  return `<div class="panel" style="margin-bottom:12px"><div class="inline-fields" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
    <div class="field"><label for="v-brb">${t.bBarber}</label><select id="v-brb" name="barber">${BARBERS.map(b => `<option value="${esc(b.id)}" ${ME && ME.barber_id === b.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="v-svc">${t.service}</label><select id="v-svc" name="service">${SERVICES.filter(x => x.active).map(x => `<option value="${esc(x.id)}">${esc(sName(x))} · ${t.dur(x.minutes)}</option>`).join('')}</select></div>
    <div class="field"><label for="v-start">${t.bFrom}</label><select id="v-start" name="start">${timeOpts(SET.open_min, SET.close_min - 15, SET.step_min, -1)}</select></div>
    <div class="field"><label for="v-src">${t.vSrc}</label><select id="v-src" name="source">${['phone','walkin','treatwell'].map(k => `<option value="${k}">${t.srcN[k]}</option>`).join('')}</select></div>
    <div class="field"><label for="v-name">${t.vName}</label><input id="v-name" name="client_name" autocomplete="off" maxlength="60"></div>
    <div class="field"><label for="v-phone">${t.vPhone}</label><input id="v-phone" name="client_phone" type="tel" inputmode="tel" autocomplete="off" maxlength="20"></div>
    <div class="field" style="grid-column:1/-1"><label for="v-note">${t.vNote}</label><input id="v-note" name="note" autocomplete="off" maxlength="300"></div>
  </div><button class="btn" id="v-save">${t.vSave}</button></div>`;
}
function editableBarbers() { return BARBERS.filter(b => ME && (ME.is_owner || ME.barber_id === b.id)); }
function hoursForm() {
  const t = T(), list = editableBarbers();
  if (!list.length) return `<div class="panel" style="margin-bottom:12px"><p class="info" style="margin:0">${t.notStaff}</p></div>`;
  if (!list.some(b => b.id === ad.hb)) ad.hb = list[0].id;
  const rows = [1, 2, 3, 4, 5, 6, 0].map(d => {
    const h = HOURS.find(x => x.barber_id === ad.hb && x.dow === d);
    return `<div class="hrow"><label class="hday"><input type="checkbox" data-hd="${d}" ${h ? 'checked' : ''}> ${t.dowL[d]}</label>
      <select data-hs="${d}" aria-label="${t.dowL[d]} ${t.bFrom}" ${h ? '' : 'disabled'}>${timeOpts(SET.open_min, SET.close_min - 30, 30, h ? h.start_min : SET.open_min)}</select>
      <span>${t.hTo}</span>
      <select data-he="${d}" aria-label="${t.dowL[d]} ${t.hTo}" ${h ? '' : 'disabled'}>${timeOpts(SET.open_min + 30, SET.close_min, 30, h ? h.end_min : SET.close_min)}</select></div>`;
  }).join('');
  return `<div class="panel" style="margin-bottom:12px">
    ${list.length > 1 ? `<div class="field" style="max-width:220px"><label for="h-brb">${t.bBarber}</label><select id="h-brb">${list.map(b => `<option value="${esc(b.id)}" ${b.id === ad.hb ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select></div>` : `<h3>${esc(list[0].name)}</h3>`}
    <div class="hours-grid">${rows}</div><p class="info">${t.hInfo}</p><button class="btn" id="h-save">${t.hSave}</button></div>`;
}
function blockForm() {
  const t = T(), opts = []; for (let x = SET.open_min; x < SET.close_min; x += SET.step_min) opts.push(`<option value="${x}">${hm(x)}</option>`);
  return `<div class="panel" style="margin-bottom:12px"><div class="inline-fields" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
    <div class="field"><label for="b-brb">${t.bBarber}</label><select id="b-brb" name="barber">${BARBERS.map(b => `<option value="${esc(b.id)}">${esc(b.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="b-start">${t.bFrom}</label><select id="b-start" name="start">${opts.join('')}</select></div>
    <div class="field"><label for="b-len">${t.bLen}</label><select id="b-len" name="length"><option value="30">30 min</option><option value="60" selected>1 ${t.h}</option><option value="120">2 ${t.h}</option><option value="240">4 ${t.h}</option><option value="660">${t.allDay}</option></select></div>
  </div><button class="btn" id="b-save">${t.bSave}</button></div>`;
}
function moveForm(r) {
  const t = T();
  return `<div class="move-box"><div class="inline-fields" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">
    <div class="field"><label for="m-brb">${t.bBarber}</label><select id="m-brb">${BARBERS.map(b => `<option value="${esc(b.id)}" ${b.id === r.barber_id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="m-day">${t.mDay}</label><select id="m-day">${DAYS.map(d => `<option value="${d}" ${d === r.day ? 'selected' : ''}>${shortDate(d)} ${COMMON[LANG].dow[parseYmd(d).getDay()]}</option>`).join('')}</select></div>
    <div class="field"><label for="m-start">${t.bFrom}</label><select id="m-start">${timeOpts(SET.open_min, SET.close_min - 15, SET.step_min, r.start_min)}</select></div>
  </div><div class="row"><button class="btn" id="m-save">${t.mSave}</button><button class="btn ghost" id="m-close">${t.close}</button></div></div>`;
}
function detail(r) {
  const t = T();
  if (r.kind === 'block') return `<div class="panel"><h3>${t.blkH}</h3><p style="margin:0 0 12px">${esc(brb(r.barber_id).name)}, ${hm(r.start_min)}–${hm(r.end_min)}</p>${ad.moving ? moveForm(r) : `<div class="row"><button class="btn ghost" id="m-open">${t.move}</button><button class="btn ghost" data-act="cancelled">${t.unblock}</button></div>`}</div>`;
  const s = svc(r.service_id);
  const pill = r.status === 'noshow' ? `<span class="pill ns">${t.pNo}</span>` : isNew(r) ? `<span class="pill new">${t.pNew}</span>` : `<span class="pill ok">${t.pOk}</span>`;
  const created = new Intl.DateTimeFormat(LOC[LANG], { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: TZ }).format(new Date(r.created_at));
  const tel = String(r.client_phone || '').replace(/[^\d+]/g, '');
  return `<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">${t.visitH}</h3>${pill}</div>
    <div style="font-weight:700;font-size:18px">${esc(r.client_name)}</div>
    <div style="font-family:var(--f-mono);font-size:13px;margin-bottom:10px"><a class="tel" href="tel:${esc(tel)}">${esc(r.client_phone)}</a><br><span style="color:var(--muted);user-select:all">${esc(r.client_email)}</span></div>
    <div class="sum-row"><span>${t.service}</span><span>${esc(sName(s))}</span></div>
    <div class="sum-row"><span>${t.time}</span><span>${hm(r.start_min)}–${hm(r.end_min)}</span></div>
    <div class="sum-row"><span>${t.barberL}</span><span>${esc(brb(r.barber_id).name)}</span></div>
    <div class="sum-row"><span>${t.price}</span><span>${s ? eur(s.price) : '—'}</span></div>
    <div class="sum-row"><span>${t.src}</span><span>${t.srcN[r.source] || t.srcN.web}</span></div>
    <div class="sum-row"><span>${t.code}</span><span translate="no">${esc(r.code)}</span></div>
    <div class="sum-row"><span>${t.created}</span><span>${created}</span></div>
    ${r.note ? `<p class="info">“${esc(r.note)}”</p>` : ''}
    ${ad.moving ? `<div style="margin-top:14px">${moveForm(r)}</div>` : ''}
    <div class="row" style="margin-top:14px" ${ad.moving ? 'hidden' : ''}><button class="btn" id="m-open">${t.move}</button>${r.status === 'noshow' ? `<button class="btn ghost" data-act="confirmed">${t.undoNoshow}</button>` : `<button class="btn ghost" data-act="noshow">${t.noshow}</button>`}<button class="btn ghost" data-act="cancelled" data-confirm="1" style="color:var(--red)">${t.cancel}</button></div></div>`;
}
async function act(fn, okMsg) {
  if (busyAct) return; busyAct = true;
  try { const { error } = await fn(); if (error) throw error; await loadRows(); toast(okMsg); }
  catch (e) { console.error(e); toast(errCode(e) === 'slot_taken' ? T().tBusy : T().tFail); }
  busyAct = false; render();
}
function bindDash() {
  const t = T();
  admin.querySelectorAll('[data-aday]').forEach(b => b.onclick = () => { ad.date = b.dataset.aday; ad.sel = null; ad.moving = false; render(); });
  admin.querySelectorAll('[data-id]').forEach(b => b.onclick = () => { ad.sel = b.dataset.id; ad.moving = false; render(); });
  admin.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const r = ROWS.find(x => x.id === ad.sel); if (!r) return;
    if (b.dataset.confirm && !b.dataset.armed) {
      b.dataset.armed = '1'; b.textContent = t.cancelSure; announce(t.cancelSure);
      setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = t.cancel; } }, 4000); return;
    }
    const status = b.dataset.act;
    const msg = status === 'cancelled' ? (r.kind === 'block' ? t.tUnblocked : t.tCancelled) : status === 'noshow' ? t.tNoshow : t.tShow;
    if (status === 'cancelled') ad.sel = null;
    act(() => sb.rpc('set_booking_status', { p_id: r.id, p_status: status }), msg);
  });
  const qi = admin.querySelector('#q');
  if (qi) qi.oninput = () => { ad.q = qi.value; admin.querySelector('#qres').innerHTML = findHtml(); bindFind(); };
  bindFind();
  const mo = admin.querySelector('#m-open'); if (mo) mo.onclick = () => { ad.moving = true; render(); admin.querySelector('#m-start')?.focus(); };
  const mc = admin.querySelector('#m-close'); if (mc) mc.onclick = () => { ad.moving = false; render(); };
  const ms = admin.querySelector('#m-save'); if (ms) ms.onclick = () => {
    const id = ad.sel, day = admin.querySelector('#m-day').value;
    const args = { p_id: id, p_barber: admin.querySelector('#m-brb').value, p_day: day, p_start_min: +admin.querySelector('#m-start').value };
    act(async () => { const r = await sb.rpc('move_booking', args); if (!r.error) { ad.moving = false; ad.date = day; ad.scroll = null; } return r; }, t.tMoved);
  };
  admin.querySelectorAll('[data-panel]').forEach(b => b.onclick = () => { ad.panel = ad.panel === b.dataset.panel ? null : b.dataset.panel; render(); });
  const vs = admin.querySelector('#v-save'); if (vs) vs.onclick = () => {
    const name = admin.querySelector('#v-name').value.trim();
    if (!name) { toast(t.vNeedName); admin.querySelector('#v-name').focus(); return; }
    const args = { p_barber: admin.querySelector('#v-brb').value, p_service: admin.querySelector('#v-svc').value, p_day: ad.date,
      p_start_min: +admin.querySelector('#v-start').value, p_name: name, p_phone: admin.querySelector('#v-phone').value.trim() || null,
      p_note: admin.querySelector('#v-note').value.trim() || null, p_source: admin.querySelector('#v-src').value };
    ad.panel = null;
    act(() => sb.rpc('staff_create_booking', args), t.tAdded);
  };
  const hbSel = admin.querySelector('#h-brb'); if (hbSel) hbSel.onchange = () => { ad.hb = hbSel.value; render(); };
  admin.querySelectorAll('[data-hd]').forEach(c => c.onchange = () => {
    const d = c.dataset.hd; admin.querySelector(`[data-hs="${d}"]`).disabled = !c.checked; admin.querySelector(`[data-he="${d}"]`).disabled = !c.checked;
  });
  const hs = admin.querySelector('#h-save'); if (hs) hs.onclick = async () => {
    const out = [];
    for (const c of admin.querySelectorAll('[data-hd]')) {
      if (!c.checked) continue;
      const d = +c.dataset.hd, a = +admin.querySelector(`[data-hs="${d}"]`).value, e = +admin.querySelector(`[data-he="${d}"]`).value;
      if (e <= a) { toast(t.tFail); return; }
      out.push({ dow: d, start: a, end: e });
    }
    const barber = ad.hb;
    act(async () => {
      const r = await sb.rpc('set_hours', { p_barber: barber, p_hours: out }); if (r.error) return r;
      const h = await sb.from('barber_hours').select('*'); if (!h.error) HOURS = h.data || []; return h;
    }, t.tHours);
  };
  admin.querySelector('#ref').onclick = () => act(async () => ({ error: null }), t.refreshed);
  const bs = admin.querySelector('#b-save'); if (bs) bs.onclick = () => {
    const barber = admin.querySelector('#b-brb').value, start = +admin.querySelector('#b-start').value;
    const len = Math.min(+admin.querySelector('#b-len').value, SET.close_min - start);
    ad.panel = null;
    act(() => sb.rpc('add_block', { p_barber: barber, p_day: ad.date, p_start_min: start, p_minutes: len }), t.tBlocked);
  };
  admin.querySelector('#copy').onclick = () => {
    const i = admin.querySelector('#f-link');
    try { navigator.clipboard.writeText(i.value).then(() => toast(t.tCopied), () => { i.select(); toast(t.tSelect); }); } catch (e) { i.select(); toast(t.tSelect); }
  };
}

document.getElementById('skip').onclick = e => { e.preventDefault(); admin.focus(); };
document.getElementById('logout').onclick = async () => { await sb.auth.signOut(); session = null; ROWS = []; ad.sel = null; view = 'login'; render(); };
bindLangButtons(render);

(async () => {
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (session) enter(); else { view = 'login'; render(); }
})();
setInterval(() => { if (view === 'dash' && !document.hidden && !busyAct && !ad.panel && !ad.moving && document.activeElement?.id !== 'q') loadRows().then(render).catch(() => {}); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && view === 'dash' && !ad.panel) loadRows().then(render).catch(() => {}); });
</script>
</body>
</html>
